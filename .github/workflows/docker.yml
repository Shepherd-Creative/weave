name: Docker (weave-mcp-server)

on:
  push:
    branches:
      - main
    # Trigger a tagged release when a Changesets-generated tag lands
    # (e.g. `@shepherd-creative/weave-mcp-server@0.1.0`). The release.yml
    # workflow publishes the npm package on tags — this one ships the
    # Docker image to GHCR alongside.
    tags:
      - "@shepherd-creative/weave-mcp-server@*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag strategy:
      # - `latest` on pushes to main (moving tag for dev / auto-deploy)
      # - `{version}` on `@shepherd-creative/weave-mcp-server@{version}`
      #   tags (immutable per release)
      # - `main-{sha}` on every main push (pin-able for rollbacks)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/shepherd-creative/weave-mcp-server
          tags: |
            type=ref,event=branch,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main-{{sha}},enable={{is_default_branch}}
            type=match,pattern=@shepherd-creative/weave-mcp-server@(.*),group=1

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          # Build context is the monorepo root — the Dockerfile needs
          # access to pnpm-workspace.yaml, pnpm-lock.yaml, and all
          # workspace packages' manifests.
          context: .
          file: packages/weave-mcp-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
